name: Make Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no v (e.g., 27.0.0)'
        required: true
        type: string
      skip_tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub release (the tag and JitPack build happen either way)'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Test, Tag and Release (JitPack)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code (develop)
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: ./gradlew test

      - name: Build library
        run: ./gradlew build -x test
        env:
          VERSION: ${{ inputs.version }}

      # The tag has no "v": JitPack publishes under the tag name exactly, and robot projects
      # and the vendordep JSON ask for mw-lib-java:<version>. A "v27.0.0" tag published only
      # as mw-lib-java:v27.0.0, so 27.0.0 never resolved.
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release version ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      # JitPack builds a tag the first time someone asks for it. Ask now, so the release is
      # resolvable (and a broken JitPack build fails this run) before any robot project needs it.
      - name: Build on JitPack
        run: |
          base="https://jitpack.io/com/github/FRC-Team-4143/MW-Lib/mw-lib-java/${{ inputs.version }}"
          pom="$base/mw-lib-java-${{ inputs.version }}.pom"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 "$pom" || echo 000)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "JitPack did not publish ${{ inputs.version }}; its build log:"
          curl -s "$base/build.log" | tail -100
          exit 1

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: MW-Lib v${{ inputs.version }}
          body: |
            ## Installation
            Add to your `build.gradle`:
            ```gradle
            repositories {
                maven { url = 'https://jitpack.io' }
            }
            dependencies {
                implementation 'com.github.FRC-Team-4143.MW-Lib:mw-lib-java:${{ inputs.version }}'
            }
            ```
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

      - name: Create summary
        run: |
          echo "# ✓ Released MW-Lib ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`implementation 'com.github.FRC-Team-4143.MW-Lib:mw-lib-java:${{ inputs.version }}'\` from \`https://jitpack.io\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "JitPack build log: https://jitpack.io/com/github/FRC-Team-4143/MW-Lib/mw-lib-java/${{ inputs.version }}/build.log" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 API docs: https://frc-team-4143.github.io/MW-Lib/" >> $GITHUB_STEP_SUMMARY

  deploy-docs:
    name: Generate & Deploy Javadocs
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code (develop)
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Javadoc
        run: ./gradlew javadoc --info

      - name: Assemble site (main docs + bundled vendor javadoc)
        run: |
          mkdir -p site
          cp -r build/docs/javadoc/. site/
          # Bundled vendor javadoc that we linkOffline to (paths must match the linkOffline URLs).
          if [ -d build/docs/vendor ]; then
            mkdir -p site/vendor
            cp -r build/docs/vendor/. site/vendor/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
