name: Make Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no v (e.g., 27.0.0)'
        required: true
        type: string
      skip_tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub release (the tag and JitPack build happen either way)'
        required: false
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release (always on for branches other than develop-2027)'
        required: false
        type: boolean
        default: false

env:
  # Full releases come from this branch; any other branch can only cut a pre-release.
  RELEASE_BRANCH: develop-2027

jobs:
  publish:
    name: Test, Tag and Release (JitPack)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_prerelease: ${{ steps.release_type.outputs.is_prerelease }}

    steps:
      - name: Determine release type
        id: release_type
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          if [ "$BRANCH" = "$RELEASE_BRANCH" ]; then
            is_prerelease="$PRERELEASE_INPUT"
          else
            is_prerelease=true
            # Pre-releases need a version suffix (e.g. 27.0.0-beta.1) so a branch build never
            # takes the tag (and therefore the JitPack version) a real release needs.
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Releases from '$BRANCH' must use a pre-release version suffix (e.g. ${VERSION}-${BRANCH//\//-}.1)"
              exit 1
            fi
          fi
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing from branch '$BRANCH' (pre-release: $is_prerelease)"

      - name: Checkout code (${{ github.ref_name }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: ./gradlew test

      - name: Build library
        run: ./gradlew build -x test
        env:
          VERSION: ${{ inputs.version }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release version ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      # JitPack builds a tag the first time someone asks for it. Ask now, so the release is
      # resolvable (and a broken JitPack build fails this run) before any robot project needs it.
      - name: Build on JitPack
        run: |
          base="https://jitpack.io/com/github/FRC-Team-4143/MW-Lib/mw-lib-java/${{ inputs.version }}"
          pom="$base/mw-lib-java-${{ inputs.version }}.pom"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 "$pom" || echo 000)
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "JitPack did not publish ${{ inputs.version }}; its build log:"
          curl -s "$base/build.log" | tail -100
          exit 1

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: MW-Lib v${{ inputs.version }}
          body: |
            ## Installation
            Add to your `build.gradle`:
            ```gradle
            repositories {
                maven { url = 'https://jitpack.io' }
            }
            dependencies {
                implementation 'com.github.FRC-Team-4143.MW-Lib:mw-lib-java:${{ inputs.version }}'
            }
            ```
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

      - name: Create summary
        run: |
          echo "# ✓ Released MW-Lib ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }} · **Pre-release:** ${{ steps.release_type.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`implementation 'com.github.FRC-Team-4143.MW-Lib:mw-lib-java:${{ inputs.version }}'\` from \`https://jitpack.io\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "JitPack build log: https://jitpack.io/com/github/FRC-Team-4143/MW-Lib/mw-lib-java/${{ inputs.version }}/build.log" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 API docs: https://frc-team-4143.github.io/MW-Lib/" >> $GITHUB_STEP_SUMMARY

  deploy-docs:
    name: Generate & Deploy Javadocs
    needs: publish
    # Pre-releases don't replace the published docs. (env isn't available in a job-level if.)
    if: ${{ github.ref_name == 'develop-2027' && needs.publish.outputs.is_prerelease != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code (${{ github.ref_name }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Javadoc
        run: ./gradlew javadoc --info

      - name: Assemble site (main docs + bundled vendor javadoc)
        run: |
          mkdir -p site
          cp -r build/docs/javadoc/. site/
          # Bundled vendor javadoc that we linkOffline to (paths must match the linkOffline URLs).
          if [ -d build/docs/vendor ]; then
            mkdir -p site/vendor
            cp -r build/docs/vendor/. site/vendor/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
