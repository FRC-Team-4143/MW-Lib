<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--CONSOLE-START-->
<title>Subsystem Console</title>
<style>
/* Layout: status bar on top, subsystem list | selected subsystem's IO bench. System fonts only: no internet at events. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --sunk:#f6f8fa; --fg:#16202b; --muted:#5a6776; --line:#d9dfe6;
  --accent:#2f66d0; --accent-ink:#ffffff;
  --ok:#1d8a4d; --ok-bg:#e3f4ea; --tune:#b87400; --tune-bg:#fdf1da; --off:#bf3434; --off-bg:#fbe6e6;
  --pin:#6a4fc4; --pin-bg:#eee9fb;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --panel:#161d25; --sunk:#11171e; --fg:#e4e9ef; --muted:#93a0b0; --line:#2a3440;
  --accent:#6b9cff; --accent-ink:#0b1220;
  --ok:#43c77d; --ok-bg:#14301f; --tune:#f0b13a; --tune-bg:#352710; --off:#f07272; --off-bg:#3a1a1a;
  --pin:#a993ff; --pin-bg:#241d3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --panel:#161d25; --sunk:#11171e; --fg:#e4e9ef; --muted:#93a0b0; --line:#2a3440;
  --accent:#6b9cff; --accent-ink:#0b1220;
  --ok:#43c77d; --ok-bg:#14301f; --tune:#f0b13a; --tune-bg:#352710; --off:#f07272; --off-bg:#3a1a1a;
  --pin:#a993ff; --pin-bg:#241d3d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.wrap > *{min-width:0}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.15rem;font-weight:700}
h2{font-size:1rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grow{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.off{color:var(--off);background:var(--off-bg);border-color:transparent}
.chip.tune{color:var(--tune);background:var(--tune-bg);border-color:transparent}
.chip.pin{color:var(--pin);background:var(--pin-bg);border-color:transparent}
.host{display:flex;gap:6px;align-items:center}
.host input{width:150px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-family:var(--mono);font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:.82rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.82rem;color:var(--muted)}
.demo-bar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.banner{border-radius:8px;padding:8px 12px;font-size:.85rem;border:1px solid var(--line);background:var(--panel)}
.banner.warn{background:var(--off-bg);color:var(--off);border-color:transparent}

.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:12px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid > *{min-width:0}
.col{display:grid;gap:10px;min-width:0}

.sub{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px;display:grid;gap:8px;cursor:pointer}
.sub[aria-current="true"]{box-shadow:0 0 0 2px var(--accent)}
.sub[data-c="ENABLED"]{border-left-color:var(--ok)} .sub[data-c="TUNING"]{border-left-color:var(--tune)} .sub[data-c="DISABLED"]{border-left-color:var(--off)}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row.between{justify-content:space-between}
.state{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.state b{color:var(--fg);font-weight:600}
.note{font-size:.8rem;color:var(--off)}
.iochips{display:flex;flex-wrap:wrap;gap:4px}
.iochip{flex:0 0 auto;font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.iochip.off{color:var(--off);border-color:var(--off)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:4px 10px;font-size:.8rem;color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:disabled{cursor:not-allowed;opacity:.5}
.seg button[aria-pressed="true"]{font-weight:650}
.seg button[aria-pressed="true"][data-v="ENABLED"]{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="TUNING"]{background:var(--tune-bg);color:var(--tune)}
.seg button[aria-pressed="true"][data-v="DISABLED"]{background:var(--off-bg);color:var(--off)}
select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-family:var(--mono);font-size:.8rem}

.bench{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px;min-width:0}
.io{border:1px solid var(--line);border-radius:9px;background:var(--sunk);padding:10px 12px;display:grid;gap:10px;min-width:0}
.io.disabled{opacity:.92}
.io-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.key{font-family:var(--mono);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:.82rem}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
.section{display:grid;gap:6px}
.section > .label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=number]{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--mono);font-size:.82rem}
.setpoints{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sp{display:grid;gap:2px}
.sp .lbl{font-size:.78rem;color:var(--muted)}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-width:360px}
.readout div{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
.readout small{display:block;font-size:.68rem;color:var(--muted)}
.readout b{font-family:var(--mono);font-weight:550;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hint{font-size:.82rem;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:8px}
fieldset:disabled{opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <h1>Subsystem Console</h1>
    <span id="conn" class="chip"><i></i><span>Connecting</span></span>
    <span id="dsChip" class="chip" hidden><i></i><span></span></span>
    <span id="fmsChip" class="chip off" hidden><i></i><span>FMS attached</span></span>
    <span class="grow"></span>
    <form class="host" id="hostForm">
      <label for="host" class="muted">Robot</label>
      <input id="host" spellcheck="false" autocomplete="off">
      <button class="btn" type="submit">Connect</button>
      <button class="btn" type="button" id="demoBtn">Demo robot</button>
    </form>
  </div>
  <div id="demoBar" class="banner demo-bar" hidden>
    <b>Demo robot</b><span>Nothing here talks to a real robot.</span>
    <label><input type="checkbox" id="demoEnabled" checked> Robot enabled</label>
    <label><input type="checkbox" id="demoFms"> FMS attached</label>
  </div>
  <div id="fmsBanner" class="banner warn" hidden>FMS attached: Tuning is refused, and anything left in Tuning goes back to Enabled when the robot resets. Disabling still works.</div>

  <div class="grid">
    <div class="col" id="subList"></div>
    <div class="bench" id="bench"><div class="empty">Waiting for the robot to publish its subsystems.</div></div>
  </div>
</div>

<script>
(function(){
"use strict";
const ROOT = "/MwLib/Subsystems/";
const MODES = ["ENABLED","DISABLED","TUNING"];
const MODE_LABEL = {ENABLED:"Enabled",DISABLED:"Disabled",TUNING:"Tuning"};
const SETPOINT_LABEL = {"PositionGains/Setpoint":"Position","VelocityGains/Setpoint":"Velocity","DutyCycle/Setpoint":"Duty cycle","CurrentGains/Setpoint":"Current"};

// =====================================================================
// MessagePack (just what NT4 uses)
// =====================================================================
const enc = new TextEncoder(), dec = new TextDecoder();
function mpEncode(v, out){
  if (v === null || v === undefined) out.push(0xc0);
  else if (v === true) out.push(0xc3);
  else if (v === false) out.push(0xc2);
  else if (typeof v === "bigint"){ out.push(0xd3); const b=new DataView(new ArrayBuffer(8)); b.setBigInt64(0,v); for(let i=0;i<8;i++) out.push(b.getUint8(i)); }
  else if (typeof v === "number"){
    if (Number.isInteger(v) && v >= -32 && v < 128){ out.push(v & 0xff); }
    else if (Number.isInteger(v) && Math.abs(v) < 2**31){ out.push(0xd2); const b=new DataView(new ArrayBuffer(4)); b.setInt32(0,v); for(let i=0;i<4;i++) out.push(b.getUint8(i)); }
    else { out.push(0xcb); const b=new DataView(new ArrayBuffer(8)); b.setFloat64(0,v); for(let i=0;i<8;i++) out.push(b.getUint8(i)); }
  }
  else if (typeof v === "string"){ const s=enc.encode(v); if (s.length<32) out.push(0xa0|s.length); else if (s.length<256) out.push(0xd9,s.length); else out.push(0xda,s.length>>8,s.length&255); for (const c of s) out.push(c); }
  else if (Array.isArray(v)){ if (v.length<16) out.push(0x90|v.length); else out.push(0xdc,v.length>>8,v.length&255); for (const x of v) mpEncode(x,out); }
  return out;
}
function mpDecodeAll(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf); let o = 0; const res = [];
  function str(n){ const s = dec.decode(u8.subarray(o,o+n)); o+=n; return s; }
  function arr(n){ const a=[]; for(let i=0;i<n;i++) a.push(read()); return a; }
  function map(n){ const m={}; for(let i=0;i<n;i++){ const k=read(); m[k]=read(); } return m; }
  function read(){
    const t = u8[o++];
    if (t < 0x80) return t;
    if (t >= 0xe0) return t - 256;
    if ((t & 0xf0) === 0x90) return arr(t & 15);
    if ((t & 0xf0) === 0x80) return map(t & 15);
    if ((t & 0xe0) === 0xa0) return str(t & 31);
    let v;
    switch(t){
      case 0xc0: return null; case 0xc2: return false; case 0xc3: return true;
      case 0xca: v=dv.getFloat32(o); o+=4; return v;
      case 0xcb: v=dv.getFloat64(o); o+=8; return v;
      case 0xcc: return u8[o++];
      case 0xcd: v=dv.getUint16(o); o+=2; return v;
      case 0xce: v=dv.getUint32(o); o+=4; return v;
      case 0xcf: v=Number(dv.getBigUint64(o)); o+=8; return v;
      case 0xd0: v=dv.getInt8(o); o+=1; return v;
      case 0xd1: v=dv.getInt16(o); o+=2; return v;
      case 0xd2: v=dv.getInt32(o); o+=4; return v;
      case 0xd3: v=Number(dv.getBigInt64(o)); o+=8; return v;
      case 0xd9: return str(u8[o++]);
      case 0xda: v=dv.getUint16(o); o+=2; return str(v);
      case 0xdb: v=dv.getUint32(o); o+=4; return str(v);
      case 0xc4: v=u8[o++]; o+=v; return null;
      case 0xc5: v=dv.getUint16(o); o+=2+v; return null;
      case 0xc6: v=dv.getUint32(o); o+=4+v; return null;
      case 0xdc: v=dv.getUint16(o); o+=2; return arr(v);
      case 0xdd: v=dv.getUint32(o); o+=4; return arr(v);
      case 0xde: v=dv.getUint16(o); o+=2; return map(v);
      default: throw new Error("msgpack type 0x"+t.toString(16));
    }
  }
  while (o < u8.length) res.push(read());
  return res;
}

// =====================================================================
// Data store shared by the NT4 client and the demo robot
// =====================================================================
class Store {
  constructor(){ this.values = new Map(); this.version = 0; this.topoVersion = 0; }
  put(name, value){
    const had = this.values.has(name);
    this.values.set(name, value);
    if (!had) this.topoVersion++;
    this.version++;
  }
  get(name, fallback){ return this.values.has(name) ? this.values.get(name) : fallback; }
  clear(){ this.values.clear(); this.version++; this.topoVersion++; }
}
const store = new Store();

// =====================================================================
// NT4 client
// =====================================================================
const TYPE_IDX = {"boolean":0,"double":1,"int":2,"float":3,"string":4,"raw":5,"boolean[]":16,"double[]":17,"int[]":18,"float[]":19,"string[]":20};
class NT4 {
  constructor(host, onStatus){
    this.host = host; this.onStatus = onStatus; this.ws = null; this.closed = false;
    this.byId = new Map(); this.types = new Map(); this.pubs = new Map(); this.nextPub = 1; this.nextSub = 1;
    this.offset = 0; this.subscribed = new Set();
    this.connect();
  }
  now(){ return Math.round(performance.now()*1000); }
  serverTime(){ return this.now() + this.offset; }
  connect(){
    if (this.closed) return;
    this.onStatus("connecting");
    let ws;
    try { ws = new WebSocket(`ws://${this.host}:5810/nt/mwlib-console-${Math.floor(Math.random()*1e6)}`, ["v4.1.networktables.first.wpi.edu","networktables.first.wpi.edu"]); }
    catch(e){ this.onStatus("failed"); this.retry(); return; }
    ws.binaryType = "arraybuffer";
    this.ws = ws;
    ws.onopen = () => {
      this.byId.clear(); this.pubs.clear(); this.subscribed.clear();
      this.onStatus("connected");
      this.sendTimeSync();
      this.timer = setInterval(() => this.sendTimeSync(), 3000);
      this.subscribe(["/MwLib/","/FMSInfo/"], 0.05);
    };
    ws.onclose = () => { clearInterval(this.timer); if (!this.closed){ this.onStatus("disconnected"); this.retry(); } };
    ws.onerror = () => {};
    ws.onmessage = (ev) => {
      if (typeof ev.data === "string"){
        for (const m of JSON.parse(ev.data)) this.handleText(m);
      } else {
        for (const msg of mpDecodeAll(ev.data)){
          if (!Array.isArray(msg) || msg.length < 4) continue;
          const [id, ts, , value] = msg;
          if (id === -1){ const rtt = this.now() - value; this.offset = ts + rtt/2 - this.now(); continue; }
          const name = this.byId.get(id);
          if (name !== undefined) store.put(name, value);
        }
      }
    };
  }
  retry(){ clearTimeout(this.rt); this.rt = setTimeout(() => this.connect(), 1500); }
  close(){ this.closed = true; clearTimeout(this.rt); clearInterval(this.timer); if (this.ws) this.ws.close(); }
  sendText(msgs){ if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(msgs)); }
  sendBin(arr){ if (this.ws && this.ws.readyState === 1) this.ws.send(new Uint8Array(mpEncode(arr, []))); }
  sendTimeSync(){ this.sendBin([-1, 0, 2, this.now()]); }
  handleText(m){
    if (m.method === "announce"){ this.byId.set(m.params.id, m.params.name); this.types.set(m.params.name, m.params.type); }
    else if (m.method === "unannounce"){ this.byId.delete(m.params.id); }
  }
  subscribe(topics, periodic){
    const fresh = topics.filter(t => !this.subscribed.has(t));
    if (!fresh.length) return;
    fresh.forEach(t => this.subscribed.add(t));
    this.sendText([{method:"subscribe", params:{topics:fresh, subuid:this.nextSub++, options:{prefix:true, periodic}}}]);
  }
  set(name, type, value){
    type = this.types.get(name) || type;
    let pub = this.pubs.get(name);
    if (!pub){
      pub = this.nextPub++;
      this.pubs.set(name, pub);
      this.sendText([{method:"publish", params:{name, pubuid:pub, type, properties:{}}}]);
    }
    let v = value;
    if (type === "int") v = Math.round(value);
    this.sendBin([pub, this.serverTime(), TYPE_IDX[type], v]);
    store.put(name, value);
  }
}

// =====================================================================
// Demo robot: the same rules as the Java code, with a little physics
// =====================================================================
class DemoRobot {
  constructor(){
    this.t = 0; this.enabled = true; this.fms = false;
    const P = ["PositionGains/Setpoint","VelocityGains/Setpoint","DutyCycle/Setpoint","CurrentGains/Setpoint"];
    this.subs = {
      Drivetrain:{states:["FIELD_CENTRIC","ROBOT_CENTRIC","TRACTOR_BEAM"],def:"FIELD_CENTRIC",
        mechs:[{name:"Swerve",kind:"swerve",setpoints:[],vmax:4.5}]},
      Elevator:{states:["STOW","L2","L4"],def:"STOW",
        mechs:[{name:"Elevator",kind:"pos",setpoints:P,min:0,max:1.4,g:3}]},
      Intake:{states:["STOW","DEPLOY","EJECT"],def:"STOW",
        mechs:[{name:"Pivot",kind:"pos",setpoints:P,min:-0.2,max:1.9,g:2},
               {name:"Rollers",kind:"vel",setpoints:P,min:-300,max:300,A:10}]},
      Shooter:{states:["IDLE","SPIN_UP","SHOOT"],def:"IDLE",
        mechs:[{name:"Flywheel",kind:"vel",setpoints:P.slice(1),min:0,max:600,A:2.5},
               {name:"Hood",kind:"pos",setpoints:P,min:0.2,max:1.0,g:1}]},
    };
    // what each state asks its mechanisms for: [target kind, value]
    this.targets = {
      Drivetrain:{FIELD_CENTRIC:{Swerve:["VEL",1.5]},ROBOT_CENTRIC:{Swerve:["VEL",0.8]},TRACTOR_BEAM:{Swerve:["VEL",1.0]}},
      Elevator:{STOW:{Elevator:["POS",0.05]},L2:{Elevator:["POS",0.6]},L4:{Elevator:["POS",1.25]}},
      Intake:{STOW:{Pivot:["POS",1.8],Rollers:["VEL",0]},DEPLOY:{Pivot:["POS",0],Rollers:["VEL",250]},EJECT:{Pivot:["POS",0.6],Rollers:["VEL",-200]}},
      Shooter:{IDLE:{Flywheel:["VEL",0],Hood:["POS",0.35]},SPIN_UP:{Flywheel:["VEL",480],Hood:["POS",0.7]},SHOOT:{Flywheel:["VEL",500],Hood:["POS",0.72]}},
    };
    this.driver = [
      {Drivetrain:"FIELD_CENTRIC",Elevator:"STOW",Intake:"DEPLOY",Shooter:"IDLE"},
      {Drivetrain:"FIELD_CENTRIC",Elevator:"L2",Intake:"STOW",Shooter:"SPIN_UP"},
      {Drivetrain:"TRACTOR_BEAM",Elevator:"L4",Intake:"STOW",Shooter:"SHOOT"},
      {Drivetrain:"ROBOT_CENTRIC",Elevator:"STOW",Intake:"EJECT",Shooter:"IDLE"},
    ];
    for (const [s,def] of Object.entries(this.subs)){
      def.mode = "ENABLED"; def.state = def.def;
      store.put(ROOT+s+"/Mode","ENABLED"); store.put(ROOT+s+"/ActiveMode","ENABLED");
      for (const m of def.mechs){
        m.key = "Subsystem/"+s+"/"+m.name+"/";
        m.x = m.kind==="pos" ? 0.2 : 0; m.v = 0; m.ang = 0; m.on = true; m.target = ["VEL",0]; m.seen = {};
        store.put(ROOT+s+"/Mechs/"+m.name+"/Enabled", true); store.put(ROOT+s+"/Mechs/"+m.name+"/LoggingKey", m.key);
        for (const sp of m.setpoints){ store.put("/Tuning/"+m.key+sp, 0); m.seen[sp] = 0; }
        store.put("/Tuning/"+m.key+"PositionGains/kP", 40); // gains exist too; the console leaves them alone
      }
    }
    // opening scene: Elevator on the bench holding 0.9 m, Intake rollers off, Shooter disabled
    for (let i=0;i<60;i++) this.step();
    store.put(ROOT+"Elevator/Mode","TUNING"); this.step();
    store.put("/Tuning/Subsystem/Elevator/Elevator/PositionGains/Setpoint", 0.9);
    store.put(ROOT+"Intake/Mechs/Rollers/Enabled", false);
    store.put(ROOT+"Shooter/Mode","DISABLED");
    for (let i=0;i<150;i++) this.step();
    this.timer = setInterval(() => this.step(), 20);
  }
  set(name, type, value){ store.put(name, value); }
  close(){ clearInterval(this.timer); }
  hold(m){ m.target = m.kind === "pos" ? ["POS", this.measured(m).pos] : m.kind === "vel" ? ["VEL",0] : ["VEL",0]; }
  step(){
    const dt = 0.02; this.t += dt;
    store.put("/FMSInfo/FMSControlData", (this.enabled?1:0) | (this.fms?16:0) | 32);
    const driverStep = this.driver[Math.floor(this.t/4) % this.driver.length];
    for (const [s,def] of Object.entries(this.subs)){
      // mode switch (the robot applies it once, on the change)
      const want = String(store.get(ROOT+s+"/Mode","ENABLED")).trim().toUpperCase();
      if (want !== def.mode){
        if (!MODES.includes(want) || (want === "TUNING" && this.fms)) store.put(ROOT+s+"/Mode", def.mode);
        else {
          def.mode = want; store.put(ROOT+s+"/ActiveMode", want);
          if (want === "TUNING") def.mechs.forEach(m => this.hold(m));
          if (want === "ENABLED") def.state = def.def;
        }
      }
      if (def.mode === "ENABLED") def.state = driverStep[s];
      store.put("/AdvantageKit/RealOutputs/Subsystem/"+s+"/State", def.state);
      for (const m of def.mechs){
        const on = store.get(ROOT+s+"/Mechs/"+m.name+"/Enabled", true) !== false;
        if (on !== m.on){ m.on = on; if (on && def.mode === "TUNING") this.hold(m); }
        // setpoint tunables call setTarget* when they change, in any mode
        for (const sp of m.setpoints){
          const v = +store.get("/Tuning/"+m.key+sp, 0);
          if (v !== m.seen[sp]){ m.seen[sp] = v; m.target = [{"PositionGains/Setpoint":"POS","VelocityGains/Setpoint":"VEL","DutyCycle/Setpoint":"DUTY","CurrentGains/Setpoint":"CUR"}[sp], v]; }
        }
        if (def.mode === "ENABLED"){ const tg = (this.targets[s][def.state] || {})[m.name]; if (tg) m.target = tg; }
        const neutral = !this.enabled || !m.on || def.mode === "DISABLED";
        this.physics(m, neutral ? ["NEUTRAL",0] : m.target, dt);
        const me = this.measured(m);
        store.put("/AdvantageKit/"+m.key+"Inputs/position", me.pos);
        store.put("/AdvantageKit/"+m.key+"Inputs/velocity", me.vel);
      }
    }
  }
  measured(m){
    if (m.kind === "pos") return {pos: m.min + m.x*(m.max-m.min), vel: m.v*(m.max-m.min)};
    if (m.kind === "vel") return {pos: m.ang, vel: m.x*m.max};
    return {pos: 0, vel: m.x*m.vmax};
  }
  physics(m, [kind, val], dt){
    if (m.kind === "pos"){
      const span = m.max-m.min; let u;
      if (kind === "NEUTRAL") u = -25*m.v + m.g*0.9;
      else if (kind === "DUTY") u = val*12;
      else if (kind === "CUR") u = val/40*12;
      else if (kind === "VEL") u = 8*(val/span - m.v) + m.g;
      else u = 40*((val-m.min)/span - m.x) - 8*m.v + m.g;
      u = Math.max(-12, Math.min(12, u));
      m.v += (u - m.g)*dt; m.x += m.v*dt;
      if (m.x < 0){ m.x = 0; if (m.v < 0) m.v = 0; } if (m.x > 1){ m.x = 1; if (m.v > 0) m.v = 0; }
    } else if (m.kind === "vel"){
      const full = Math.max(Math.abs(m.min), Math.abs(m.max)); let u;
      if (kind === "NEUTRAL") u = m.x*0.85*m.max/full;
      else if (kind === "DUTY") u = val;
      else if (kind === "CUR") u = val/40;
      else if (kind === "POS") u = (val-m.ang)*0.05;
      else u = val/full;
      u = Math.max(-1, Math.min(1, u));
      m.x += m.A*(u*(full/m.max) - m.x)*dt; m.ang += m.x*m.max*dt;
    } else {
      m.x += 4*((kind === "VEL" ? val/m.vmax : 0) - m.x)*dt;
    }
  }
}

// =====================================================================
// Connection
// =====================================================================
let backend = null, mode = "none";
const connEl = document.getElementById("conn");
const hostEl = document.getElementById("host");
function setConn(state){
  if (state === "connected") topoSeen = ""; // rebuild, which re-subscribes the readout topics
  const label = {connecting:"Connecting to "+hostEl.value, connected:"Connected to "+hostEl.value, disconnected:"Not connected, retrying", failed:"Can't connect", demo:"Demo robot"}[state] || state;
  connEl.className = "chip " + (state==="connected" ? "ok" : state==="demo" ? "pin" : state==="connecting" ? "" : "off");
  connEl.lastElementChild.textContent = label;
}
function connect(host){
  if (backend) backend.close();
  store.clear(); selected = null;
  document.getElementById("demoBar").hidden = true;
  mode = "nt"; backend = new NT4(host, setConn);
  try { localStorage.setItem("mwlib-console-host", host); } catch(e) {}
}
function startDemo(){
  if (backend) backend.close();
  store.clear(); selected = "Elevator";
  mode = "demo"; backend = new DemoRobot(); setConn("demo");
  document.getElementById("demoBar").hidden = false;
  document.getElementById("demoEnabled").checked = true; document.getElementById("demoFms").checked = false;
}
document.getElementById("hostForm").addEventListener("submit", e => { e.preventDefault(); connect(hostEl.value.trim() || "localhost"); });
document.getElementById("demoBtn").addEventListener("click", startDemo);
document.getElementById("demoEnabled").addEventListener("change", e => { if (mode==="demo") backend.enabled = e.target.checked; });
document.getElementById("demoFms").addEventListener("change", e => { if (mode==="demo") backend.fms = e.target.checked; });

function write(name, type, value){ if (backend) backend.set(name, type, value); }
function subscribe(topics){ if (mode === "nt") backend.subscribe(topics, 0.05); }

// =====================================================================
// Model from topics
// =====================================================================
function topology(){
  const subs = new Map();
  for (const name of store.values.keys()){
    if (!name.startsWith(ROOT)) continue;
    const parts = name.slice(ROOT.length).split("/");
    if (!subs.has(parts[0])) subs.set(parts[0], {name:parts[0], mechs:[]});
    if (parts[1] === "Mechs" && parts[3] === "Enabled") subs.get(parts[0]).mechs.push(parts[2]);
  }
  return [...subs.values()].filter(s => store.values.has(ROOT+s.name+"/Mode"));
}
function setpointsOf(key){
  const base = "/Tuning/" + key, out = [];
  for (const name of store.values.keys()) if (name.startsWith(base) && name.endsWith("/Setpoint")) out.push(name);
  const order = n => { const i = Object.keys(SETPOINT_LABEL).indexOf(n.slice(base.length)); return i < 0 ? 99 : i; };
  return out.sort((a,b) => order(a) - order(b) || a.localeCompare(b));
}
const fmt = v => (typeof v === "number" ? (v = Math.abs(v) < 5e-4 ? 0 : v, Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(3)) : v === undefined ? "–" : String(v));
function fms(){ return (store.get("/FMSInfo/FMSControlData", 0) & 16) !== 0; }
function dsEnabled(){ return (store.get("/FMSInfo/FMSControlData", 0) & 1) !== 0; }

// =====================================================================
// UI
// =====================================================================
let selected = null, topoSeen = "";
const listEl = document.getElementById("subList"), benchEl = document.getElementById("bench");
const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs||{})){ if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v); } for (const k of kids) if (k !== null && k !== undefined) e.append(k); return e; };
const select = name => { selected = name; topoSeen = ""; };

function buildList(subs){
  listEl.innerHTML = "";
  if (!subs.length){ listEl.append(el("div",{class:"empty"}, mode==="nt" ? "No subsystems yet. Is the robot running MW-Lib with subsystems registered?" : "")); return; }
  for (const s of subs){
    const card = el("div",{class:"sub", tabindex:"0", "data-sub":s.name,
      onclick:(e)=>{ if (!e.target.closest("button")) select(s.name); },
      onkeydown:(e)=>{ if (e.key === "Enter" && e.target === card) select(s.name); }});
    const seg = el("div",{class:"seg", role:"group", "aria-label":s.name+" mode"});
    for (const m of MODES) seg.append(el("button",{type:"button","data-v":m, onclick:()=>write(ROOT+s.name+"/Mode","string",m)}, MODE_LABEL[m]));
    subscribe(["/AdvantageKit/RealOutputs/Subsystem/"+s.name+"/State"]);
    card.append(
      el("div",{class:"row between"}, el("h2",{}, s.name), seg),
      el("span",{class:"state","data-r":"state"}),
      el("div",{class:"note","data-r":"note"}),
      el("div",{class:"iochips","data-r":"chips"}));
    listEl.append(card);
  }
}

function buildBench(subs){
  benchEl.innerHTML = "";
  const s = subs.find(x => x.name === selected) || subs[0];
  if (!s){ benchEl.append(el("div",{class:"empty"}, "Waiting for the robot to publish its subsystems.")); return; }
  selected = s.name;
  benchEl.append(el("div",{class:"row between"}, el("h2",{}, s.name), el("span",{class:"hint","data-r":"benchHint"})));
  for (const m of s.mechs) benchEl.append(buildMech(s.name, m));
  if (!s.mechs.length) benchEl.append(el("div",{class:"empty"}, "No mechanisms to switch."));
}

function numInput(id, topic, label){
  const inp = el("input",{type:"number", step:"any", id, "aria-label":label, "data-topic":topic});
  const send = () => { const v = parseFloat(inp.value); if (Number.isFinite(v)) write(topic, "double", v); };
  inp.addEventListener("change", send);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  return inp;
}

function buildMech(sub, mech){
  const p = ROOT+sub+"/Mechs/"+mech+"/";
  const key = store.get(p+"LoggingKey","");
  if (key) subscribe(["/Tuning/"+key, "/AdvantageKit/"+key+"Inputs/position", "/AdvantageKit/"+key+"Inputs/velocity"]);
  const card = el("div",{class:"io","data-mech":mech,"data-key":key});
  const on = el("input",{type:"checkbox", id:"en-"+sub+"-"+mech, onchange:(e)=>write(p+"Enabled","boolean",e.target.checked)});
  card.append(
    el("div",{class:"io-head"}, el("div",{}, el("h3",{}, mech), el("div",{class:"key"}, p+"Enabled")), el("label",{class:"switch"}, on, "On")),
    el("div",{class:"readout two"},
      el("div",{}, el("small",{},"Position"), el("b",{"data-r":"pos"},"–")),
      el("div",{}, el("small",{},"Velocity"), el("b",{"data-r":"vel"},"–"))));
  const fs = el("fieldset",{class:"section","data-r":"tuning"}, el("legend",{class:"label"}, "Tuning setpoints"));
  const rows = el("div",{class:"setpoints","data-r":"rows"});
  fs.append(rows, el("span",{class:"hint"}, "Each one calls the mechanism's setTarget method when its value changes. Gains stay in your usual dashboard."));
  card.append(fs);
  return card;
}

function fillSetpoints(card, sub){
  const rows = card.querySelector('[data-r="rows"]');
  const topics = setpointsOf(card.dataset.key);
  if (rows.dataset.sig === topics.join()) return;
  rows.dataset.sig = topics.join(); rows.innerHTML = "";
  if (!topics.length){ rows.append(el("span",{class:"hint"}, "No setpoint tunables. It holds still in Tuning.")); return; }
  for (const t of topics){
    const suffix = t.slice(("/Tuning/"+card.dataset.key).length);
    rows.append(el("label",{class:"sp"}, el("span",{class:"lbl"}, SETPOINT_LABEL[suffix] || suffix), numInput("sp-"+sub+"-"+card.dataset.mech+"-"+suffix.replaceAll("/","-"), t, suffix)));
  }
}

function setVal(input, v){ if (!input || document.activeElement === input || v === undefined) return; if (input.type === "checkbox") input.checked = !!v; else if (String(input.value) !== String(v)) input.value = typeof v === "number" ? +v.toFixed(4) : v; }

function refresh(){
  const subs = topology();
  const sig = subs.map(s => s.name+":"+s.mechs.join(",")).join("|") + "#" + selected;
  if (sig !== topoSeen){ topoSeen = sig; buildList(subs); buildBench(subs); }
  const f = fms(), on = dsEnabled(), haveDs = store.values.has("/FMSInfo/FMSControlData");
  document.getElementById("fmsChip").hidden = !f;
  document.getElementById("fmsBanner").hidden = !f;
  const ds = document.getElementById("dsChip"); ds.hidden = !haveDs; ds.className = "chip " + (on ? "ok" : ""); ds.lastElementChild.textContent = on ? "Enabled" : "Disabled";

  for (const card of listEl.querySelectorAll(".sub")){
    const s = card.dataset.sub, req = String(store.get(ROOT+s+"/Mode","ENABLED")).toUpperCase(), act = store.get(ROOT+s+"/ActiveMode","ENABLED");
    card.dataset.c = act; card.setAttribute("aria-current", String(s === selected));
    for (const b of card.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String(b.dataset.v === act));
    const st = store.get("/AdvantageKit/RealOutputs/Subsystem/"+s+"/State");
    const r = card.querySelector('[data-r="state"]'); r.innerHTML = ""; r.append("State ", el("b",{}, st === undefined ? "–" : String(st)), act === "ENABLED" ? "" : "  ·  logic parked");
    card.querySelector('[data-r="note"]').textContent = req === act ? "" : req === "TUNING" && f ? "Tuning is refused while the FMS is attached." : "Switching…";
    const chips = card.querySelector('[data-r="chips"]'); chips.innerHTML = "";
    const sub = subs.find(x => x.name === s);
    if (sub) for (const m of sub.mechs){
      const off = store.get(ROOT+s+"/Mechs/"+m+"/Enabled", true) === false;
      chips.append(el("span",{class:"iochip" + (off ? " off" : "")}, m + (off ? " · off" : "")));
    }
  }

  const s = selected; if (!s) return;
  const act = store.get(ROOT+s+"/ActiveMode","ENABLED");
  const hint = benchEl.querySelector('[data-r="benchHint"]');
  if (hint) hint.textContent = act === "TUNING" ? "Tuning: only the setpoints below move the mechanisms." : act === "DISABLED" ? "Disabled: every mechanism is neutral." : `Switch ${s} to Tuning to drive its mechanisms by hand.`;
  for (const card of benchEl.querySelectorAll(".io")){
    const m = card.dataset.mech, key = card.dataset.key, en = store.get(ROOT+s+"/Mechs/"+m+"/Enabled", true) !== false;
    setVal(card.querySelector('input[id^="en-"]'), en);
    card.classList.toggle("disabled", !en);
    card.querySelector('[data-r="pos"]').textContent = fmt(store.get("/AdvantageKit/"+key+"Inputs/position"));
    card.querySelector('[data-r="vel"]').textContent = fmt(store.get("/AdvantageKit/"+key+"Inputs/velocity"));
    fillSetpoints(card, s);
    const fs = card.querySelector('[data-r="tuning"]');
    fs.disabled = act !== "TUNING" || !en || f;
    for (const inp of fs.querySelectorAll('input[type=number]')) setVal(inp, store.get(inp.dataset.topic, 0));
  }
}

// =====================================================================
// Start
// =====================================================================
let savedHost = null; try { savedHost = localStorage.getItem("mwlib-console-host"); } catch(e) {}
hostEl.value = location.hostname || savedHost || "localhost";
if (window.MW_CONSOLE_DEMO === true || location.hash === "#demo") startDemo(); else connect(hostEl.value);
setInterval(refresh, 100);
})();
</script>
<!--CONSOLE-END-->
</body>
