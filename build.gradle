plugins {
    id 'java'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def wpiVersion = "2027.0.0-alpha-6"
def alpha1Base = "/home/ubuntu/wpilib/2027_alpha1/maven/edu/wpi/first"

repositories {
    // Alpha-5 WPILib local maven
    maven { url = uri('/home/ubuntu/wpilib/2027_alpha5/maven') }

    // Vendor library repositories
    maven { url = "https://maven.ctr-electronics.com/release/" }
    maven { url = "https://shenzhen-robotics-alliance.github.io/maple-sim/vendordep/repos/releases" }
    maven {
        url = "https://maven.photonvision.org/repository/internal"
        content { includeGroup "org.photonvision" }
    }
    maven {
        url = "https://maven.photonvision.org/repository/snapshots"
        content { includeGroup "org.photonvision" }
    }
    maven { url = "https://frcmaven.wpi.edu/artifactory/sleipnirgroup-mvn-release/" }
    maven { url = "https://www.playingwithfusion.com/frc/maven/" }
    maven { url = "https://storage.googleapis.com/grapple-frc-maven" }
    maven { url = "https://jitpack.io" }
    mavenCentral()
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
    }
    test {
        java { srcDirs = ['src/test/java'] }
    }
}

dependencies {
    // WPILib alpha-5 (org.wpilib.*)
    implementation "org.wpilib.wpilibj:wpilibj-java:$wpiVersion"
    implementation "org.wpilib.wpimath:wpimath-java:$wpiVersion"
    implementation "org.wpilib.wpiutil:wpiutil-java:$wpiVersion"
    implementation "org.wpilib.wpiunits:wpiunits-java:$wpiVersion"
    implementation "org.wpilib.ntcore:ntcore-java:$wpiVersion"
    implementation "org.wpilib.hal:hal-java:$wpiVersion"
    implementation "org.wpilib.apriltag:apriltag-java:$wpiVersion"
    implementation "org.wpilib.commandsv2:commandsv2-java:$wpiVersion"

    // Old WPILib alpha-1 jars as compileOnly so CTRE/MapleSim/PhotonVision can resolve edu.wpi.first.* types
    compileOnly files(
        "$alpha1Base/wpiunits/wpiunits-java/2027.0.0-alpha-2/wpiunits-java-2027.0.0-alpha-2.jar",
        "$alpha1Base/wpimath/wpimath-java/2027.0.0-alpha-2/wpimath-java-2027.0.0-alpha-2.jar",
        "$alpha1Base/wpiutil/wpiutil-java/2027.0.0-alpha-2/wpiutil-java-2027.0.0-alpha-2.jar",
        "$alpha1Base/apriltag/apriltag-java/2027.0.0-alpha-2/apriltag-java-2027.0.0-alpha-2.jar",
        "$alpha1Base/hal/hal-java/2027.0.0-alpha-2/hal-java-2027.0.0-alpha-2.jar",
        "$alpha1Base/wpilibj/wpilibj-java/2027.0.0-alpha-2/wpilibj-java-2027.0.0-alpha-2.jar",
        "$alpha1Base/ntcore/ntcore-java/2027.0.0-alpha-2/ntcore-java-2027.0.0-alpha-2.jar"
    )

    // Vendor dependencies
    implementation "com.ctre.phoenix6:wpiapi-java:26.50.0-alpha-1"
    //implementation "org.ironmaple:maplesim-java:0.4.0-beta"
    implementation "choreo:ChoreoLib-java:2027.0.0-alpha-1"
    //implementation "org.photonvision:photonlib-java:v2026.2.2"
    //implementation "org.photonvision:photontargeting-java:v2026.2.2"
    //implementation "com.playingwithfusion.frc:PlayingWithFusion-java:2026.2.25"
    implementation "com.github.jonahsnider:doglog:2027.1.0"
    implementation "au.grapplerobotics:libgrapplefrcjava:2025.1.3"
    implementation "org.ejml:ejml-simple:0.44.0"
    implementation "org.dyn4j:dyn4j:5.0.2"
    implementation "com.google.code.gson:gson:2.13.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-core:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.19.2"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
}

apply from: 'publish.gradle'

wrapper {
    gradleVersion = '9.4.1'
}
